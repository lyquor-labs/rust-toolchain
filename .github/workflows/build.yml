name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm32-std:
    name: Build rust-std (wasm32)
    runs-on: ubuntu-22.04-arm64-large
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout rust-lang/rust
        uses: actions/checkout@v6
        with:
          repository: rust-lang/rust
          ref: 1.97.0
          path: rust
          fetch-depth: 2

      - name: Copy bootstrap.toml
        run: cp bootstrap.toml rust/bootstrap.toml

      - name: Build rust-std for wasm32-unknown-unknown
        working-directory: rust
        run: ./x dist rust-std --target wasm32-unknown-unknown

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-std-dist-wasm32
          path: rust/build/dist

      - name: Prepare release metadata
        id: release_meta
        run: |
          set -euo pipefail
          release_date="$(date -u +'%Y%m%d')"
          release_branch="${GITHUB_REF_NAME//\//-}"
          release_tag="${release_branch}-${release_date}"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "name=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload dist assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.name }}
          files: rust/build/dist/*
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
