name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_VERSION: 1.99.0

permissions:
  contents: write

jobs:
  build-wasm32-std:
    name: Build rust-std (wasm32, ${{ matrix.variant }})
    runs-on: ubuntu-22.04-arm64-large
    strategy:
      fail-fast: false
      matrix:
        variant: [atomics, unwind]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout rust-lang/rust
        uses: actions/checkout@v6
        with:
          repository: rust-lang/rust
          ref: ${{ env.RUST_VERSION }}
          path: rust
          fetch-depth: 2

      - name: Copy bootstrap.toml
        run: cp "${{ matrix.variant }}/bootstrap.toml" rust/bootstrap.toml

      - name: Build rust-std for wasm32-unknown-unknown
        working-directory: rust
        run: ./x dist rust-std --target wasm32-unknown-unknown

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-std-dist-wasm32-${{ matrix.variant }}
          path: rust/build/dist

      - name: Prepare release metadata
        id: release_meta
        run: |
          set -euo pipefail
          release_date="$(date -u +'%Y%m%d')"
          release_tag="${{ matrix.variant }}-${release_date}"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload dist assets
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.tag }}
          files: rust/build/dist/*
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
